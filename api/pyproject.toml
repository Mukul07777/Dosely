[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends()/Query() in argument defaults is the framework's idiom
    "RUF001",  # Hindi and typographic characters in user-facing strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests set environment variables before importing the app

[tool.ruff.lint.isort]
known-first-party = ["core", "main", "routes", "ingest", "matcher", "testutil", "conftest"]
